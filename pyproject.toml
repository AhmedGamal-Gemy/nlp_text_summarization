[project]
name = "nlp-text-summarization"
version = "0.1.0"
description = "NLP Text Summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "sentencepiece>=0.2.1",
    "transformers[torch]<4.48.0",
    "sacremoses>=0.1.1",
    "streamlit>=1.56.0",
    "datasets>=4.8.0",
    "sentence-transformers>=2.2.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "nltk>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "hf-xet>=1.4.3",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
name = "pytorch"

[tool.uv]
index-strategy = "unsafe-best-match"
