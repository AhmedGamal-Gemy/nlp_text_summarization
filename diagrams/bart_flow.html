<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{margin:0;padding:16px;font-family:sans-serif;background:transparent;}</style>
</head><body>
<svg width="100%" viewBox="0 0 680 480" role="img">
<title>BART abstractive summarization flow</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b04420" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text font-size="15" font-weight="600" x="340" y="24" text-anchor="middle" fill="#111">BART abstractive summarization</text>

<!-- Raw article — note: no cleaning needed -->
<rect x="160" y="38" width="360" height="44" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#111">Raw article (no cleaning)</text>
<text font-size="11" x="340" y="74" text-anchor="middle" dominant-baseline="central" fill="#b04420">⚠ BART needs original text — not preprocessed</text>

<line x1="340" y1="82" x2="340" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Tokenize -->
<rect x="190" y="110" width="300" height="44" rx="8" fill="#F5B49A" stroke="#b04420" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="128" text-anchor="middle" dominant-baseline="central" fill="#111">BART tokenizer</text>
<text font-size="11" x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">truncate to 1024 tokens · return_tensors="pt"</text>

<line x1="340" y1="154" x2="340" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- BART encoder -->
<rect x="40" y="182" width="260" height="64" rx="8" fill="#F5B49A" stroke="#b04420" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="170" y="202" text-anchor="middle" dominant-baseline="central" fill="#111">BART Encoder (12 layers)</text>
<text font-size="11" x="170" y="220" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">Bidirectional — reads full article</text>
<text font-size="11" x="170" y="236" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">produces context vectors</text>

<!-- BART decoder -->
<rect x="380" y="182" width="260" height="64" rx="8" fill="#F5B49A" stroke="#b04420" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="510" y="202" text-anchor="middle" dominant-baseline="central" fill="#111">BART Decoder (12 layers)</text>
<text font-size="11" x="510" y="220" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">Autoregressive — generates tokens</text>
<text font-size="11" x="510" y="236" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">attends to encoder output</text>

<!-- Arrow encoder to decoder -->
<line x1="300" y1="214" x2="378" y2="214" stroke="#b04420" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
<text font-size="11" font-weight="600" x="340" y="208" text-anchor="middle" fill="#b04420">cross-attn</text>

<line x1="340" y1="246" x2="340" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M170 246 L170 270 L270 270" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M510 246 L510 270 L410 270" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Generate params -->
<rect x="160" y="278" width="360" height="56" rx="8" fill="#F5B49A" stroke="#b04420" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="298" text-anchor="middle" dominant-baseline="central" fill="#111">Beam search decoding</text>
<text font-size="11" x="340" y="316" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">num_beams=4 · max_length=130 · min_length=30</text>
<text font-size="11" x="340" y="330" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">length_penalty=2.0 · no_repeat_ngram_size=3</text>

<line x1="340" y1="334" x2="340" y2="366" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decode output -->
<rect x="190" y="370" width="300" height="44" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="388" text-anchor="middle" dominant-baseline="central" fill="#111">Decode token IDs → text</text>
<text font-size="11" x="340" y="406" text-anchor="middle" dominant-baseline="central" fill="#333">tokenizer.decode(skip_special_tokens=True)</text>

<line x1="340" y1="414" x2="340" y2="446" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="450" width="300" height="18" rx="4" fill="none"/>
<text font-size="13" font-weight="600" x="340" y="460" text-anchor="middle" fill="#111">Fluent abstractive summary</text>
</svg>
</body></html>
