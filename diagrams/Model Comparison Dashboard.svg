<svg width="100%" viewBox="0 0 1200 1080" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Model Comparison Dashboard</title>
  <desc>Comparison of Extractive, Abstractive, and Fine-tuned models using ROUGE scores and efficiency metrics.</desc>

  <defs>
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-small" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Gradients for Bars -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#378ADD"/>
      <stop offset="100%" style="stop-color:#185FA5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F1C40F"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ECC71"/>
      <stop offset="100%" style="stop-color:#0F6E56"/>
    </linearGradient>

    <!-- Gauge Background -->
    <linearGradient id="gaugeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="100%" style="stop-color:#F5F5F5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1080" fill="#F8F9FA"/>
  
  <!-- Header -->
  <text x="600" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#1A1A18">Model Comparison Dashboard</text>
  <text x="600" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6C757D">Comparing Extractive, Abstractive, and Fine-tuned approaches on CNN/DailyMail dataset</text>

  <!-- ════════════════════════════════════════
       COLUMNS (Cards)
  ════════════════════════════════════════ -->
  
  <!-- Column 1: Extractive (Blue) -->
  <g transform="translate(60, 110)">
    <!-- Card 1: Info -->
    <rect x="0" y="0" width="320" height="110" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <rect x="0" y="0" width="320" height="40" rx="8" fill="#E6F1FB"/>
    <rect x="0" y="20" width="320" height="20" fill="#E6F1FB"/>
    <text x="160" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0C447C">Extractive (TF-IDF)</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="13" fill="#333">Architecture: Heuristic Selection</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#333">Device: CPU</text>

    <!-- Card 2: Metrics -->
    <rect x="0" y="130" width="320" height="150" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Performance Metrics</text>
    
    <!-- ROUGE-1 -->
    <text x="20" y="190" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-1: 0.290</text>
    <rect x="20" y="200" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="200" width="168" height="8" rx="4" fill="url(#blueGrad)"/>
    <text x="195" y="207" font-family="-apple-system, sans-serif" font-size="9" fill="#FFF">0.290</text>

    <!-- ROUGE-2 -->
    <text x="20" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-2: 0.099</text>
    <rect x="20" y="240" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="240" width="66" height="8" rx="4" fill="url(#blueGrad)"/>
    <text x="90" y="247" font-family="-apple-system, sans-serif" font-size="9" fill="#333">0.099</text>

    <!-- ROUGE-L -->
    <text x="20" y="260" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-L: 0.188</text>
    <rect x="20" y="270" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="270" width="105" height="8" rx="4" fill="url(#blueGrad)"/>
    <text x="130" y="277" font-family="-apple-system, sans-serif" font-size="9" fill="#333">0.188</text>

    <!-- Card 3: Efficiency (Gauges) -->
    <rect x="0" y="300" width="320" height="100" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="330" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Efficiency</text>
    
    <!-- Gauge 1: Compression -->
    <rect x="30" y="350" width="120" height="10" rx="5" fill="url(#gaugeBg)"/>
    <rect x="30" y="350" width="25" height="10" rx="5" fill="#185FA5"/>
    <text x="90" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#555">18.9% Comp.</text>

    <!-- Gauge 2: Time -->
    <rect x="170" y="350" width="120" height="10" rx="5" fill="url(#gaugeBg)"/>
    <rect x="170" y="350" width="15" height="10" rx="5" fill="#185FA5"/>
    <text x="230" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#555">25.2s Time</text>

    <!-- Card 4: Summary Example -->
    <rect x="0" y="420" width="320" height="120" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="450" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Summary Example</text>
    <rect x="20" y="470" width="280" height="60" rx="4" fill="#F4F7FA"/>
    <text x="30" y="490" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">"The recent developments in AI have..."</text>
    <text x="30" y="505" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">"shown promise in NLP tasks."</text>
  </g>

  <!-- Column 2: Abstractive BART (Orange) -->
  <g transform="translate(440, 110)">
    <!-- Card 1: Info -->
    <rect x="0" y="0" width="320" height="110" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <rect x="0" y="0" width="320" height="40" rx="8" fill="#FFF3E0"/>
    <rect x="0" y="20" width="320" height="20" fill="#FFF3E0"/>
    <text x="160" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#B07800">Abstractive (BART)</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="13" fill="#333">Architecture: Seq2Seq Transformer</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#333">Parameters: 406M (GPU)</text>

    <!-- Card 2: Metrics -->
    <rect x="0" y="130" width="320" height="150" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Performance Metrics</text>
    
    <!-- ROUGE-1 -->
    <text x="20" y="190" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-1: 0.391</text>
    <rect x="20" y="200" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="200" width="218" height="8" rx="4" fill="url(#orangeGrad)"/>
    <text x="243" y="207" font-family="-apple-system, sans-serif" font-size="9" fill="#FFF">0.391</text>

    <!-- ROUGE-2 -->
    <text x="20" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-2: 0.169</text>
    <rect x="20" y="240" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="240" width="112" height="8" rx="4" fill="url(#orangeGrad)"/>
    <text x="135" y="247" font-family="-apple-system, sans-serif" font-size="9" fill="#333">0.169</text>

    <!-- ROUGE-L -->
    <text x="20" y="260" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-L: 0.284</text>
    <rect x="20" y="270" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="270" width="157" height="8" rx="4" fill="url(#orangeGrad)"/>
    <text x="180" y="277" font-family="-apple-system, sans-serif" font-size="9" fill="#333">0.284</text>

    <!-- Card 3: Efficiency (Gauges) -->
    <rect x="0" y="300" width="320" height="100" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="330" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Efficiency</text>
    
    <!-- Gauge 1: Compression -->
    <rect x="30" y="350" width="120" height="10" rx="5" fill="url(#gaugeBg)"/>
    <rect x="30" y="350" width="10" height="10" rx="5" fill="#E67E22"/>
    <text x="90" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#555">8.6% Comp.</text>

    <!-- Gauge 2: Time -->
    <rect x="170" y="350" width="120" height="10" rx="5" fill="url(#gaugeBg)"/>
    <rect x="170" y="350" width="120" height="10" rx="5" fill="#E67E22"/>
    <text x="230" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#555">504.8s Time</text>

    <!-- Card 4: Summary Example -->
    <rect x="0" y="420" width="320" height="120" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="450" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Summary Example</text>
    <rect x="20" y="470" width="280" height="60" rx="4" fill="#FFF8E6"/>
    <text x="30" y="490" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">"AI advancements are reshaping the..."</text>
    <text x="30" y="505" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">"landscape of natural language processing."</text>
  </g>

  <!-- Column 3: Fine-tuned BART (Green) -->
  <g transform="translate(820, 110)">
    <!-- Card 1: Info -->
    <rect x="0" y="0" width="320" height="110" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <rect x="0" y="0" width="320" height="40" rx="8" fill="#E1F5EE"/>
    <rect x="0" y="20" width="320" height="20" fill="#E1F5EE"/>
    <text x="160" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0F6E56">Fine-tuned BART</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="13" fill="#333">Architecture: Seq2Seq (Tuned)</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#333">Device: GPU (Fine-tuned)</text>

    <!-- Card 2: Metrics -->
    <rect x="0" y="130" width="320" height="150" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Performance Metrics (Est)</text>
    
    <!-- ROUGE-1 -->
    <text x="20" y="190" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-1: 0.420+</text>
    <rect x="20" y="200" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="200" width="250" height="8" rx="4" fill="url(#greenGrad)"/>
    <text x="275" y="207" font-family="-apple-system, sans-serif" font-size="9" fill="#FFF">0.420</text>

    <!-- ROUGE-2 -->
    <text x="20" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-2: 0.190+</text>
    <rect x="20" y="240" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="240" width="130" height="8" rx="4" fill="url(#greenGrad)"/>
    <text x="155" y="247" font-family="-apple-system, sans-serif" font-size="9" fill="#333">0.190</text>

    <!-- ROUGE-L -->
    <text x="20" y="260" font-family="-apple-system, sans-serif" font-size="11" fill="#555">ROUGE-L: 0.310+</text>
    <rect x="20" y="270" width="280" height="8" rx="4" fill="#F0F0F0"/>
    <rect x="20" y="270" width="180" height="8" rx="4" fill="url(#greenGrad)"/>
    <text x="205" y="277" font-family="-apple-system, sans-serif" font-size="9" fill="#333">0.310</text>

    <!-- Card 3: Efficiency (Gauges) -->
    <rect x="0" y="300" width="320" height="100" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="330" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Efficiency</text>
    
    <!-- Gauge 1: Compression -->
    <rect x="30" y="350" width="120" height="10" rx="5" fill="url(#gaugeBg)"/>
    <rect x="30" y="350" width="15" height="10" rx="5" fill="#0F6E56"/>
    <text x="90" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#555">~10% Comp.</text>

    <!-- Gauge 2: Time -->
    <rect x="170" y="350" width="120" height="10" rx="5" fill="url(#gaugeBg)"/>
    <rect x="170" y="350" width="80" height="10" rx="5" fill="#0F6E56"/>
    <text x="230" y="345" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#555">~400s Time</text>

    <!-- Card 4: Summary Example -->
    <rect x="0" y="420" width="320" height="120" rx="8" fill="#FFFFFF" filter="url(#shadow-small)"/>
    <text x="160" y="450" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Summary Example</text>
    <rect x="20" y="470" width="280" height="60" rx="4" fill="#E8F5E9"/>
    <text x="30" y="490" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">"Recent breakthroughs in artificial..."</text>
    <text x="30" y="505" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">"intelligence have optimized NLP tasks."</text>
  </g>

  <!-- ════════════════════════════════════════
       BOTTOM: RADAR CHART (Moved down significantly)
  ════════════════════════════════════════ -->
  <g transform="translate(600, 780)">
    <!-- Radar Background -->
    <polygon points="0,-120 114,-37 70,96 -70,96 -114,-37" fill="#FFFFFF" filter="url(#shadow)"/>
    <polygon points="0,-120 114,-37 70,96 -70,96 -114,-37" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- Inner Grids -->
    <polygon points="0,-80 76,-25 47,64 -47,64 -76,-25" fill="none" stroke="#F0F0F0" stroke-width="1"/>
    <polygon points="0,-40 38,-12 23,32 -23,32 -38,-12" fill="none" stroke="#F0F0F0" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#A0A0A0"/>

    <!-- Axes Lines -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="0" x2="114" y2="-37" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="0" x2="70" y2="96" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="0" x2="-70" y2="96" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="0" x2="-114" y2="-37" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Labels -->
    <text x="0" y="-135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">ROUGE-1</text>
    <text x="125" y="-35" text-anchor="start" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">ROUGE-2</text>
    <text x="80" y="110" text-anchor="start" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">ROUGE-L</text>
    <text x="-80" y="110" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">Speed</text>
    <text x="-125" y="-35" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">Compression</text>

    <!-- Data Polygons -->
    
    <!-- Extractive (Blue) -->
    <polygon points="0,-70 38,-12 33,45 -63,55 -23,-7" fill="rgba(55, 141, 221, 0.1)" stroke="url(#blueGrad)" stroke-width="2"/>
    <circle cx="0" cy="-70" r="4" fill="#185FA5"/>
    <circle cx="38" cy="-12" r="4" fill="#185FA5"/>
    <circle cx="33" cy="45" r="4" fill="#185FA5"/>
    <circle cx="-63" cy="55" r="4" fill="#185FA5"/>
    <circle cx="-23" cy="-7" r="4" fill="#185FA5"/>

    <!-- Abstractive (Orange) -->
    <polygon points="0,-94 64,-21 50,68 -21,19 -97,-32" fill="rgba(230, 126, 34, 0.1)" stroke="url(#orangeGrad)" stroke-width="2"/>
    <circle cx="0" cy="-94" r="4" fill="#E67E22"/>
    <circle cx="64" cy="-21" r="4" fill="#E67E22"/>
    <circle cx="50" cy="68" r="4" fill="#E67E22"/>
    <circle cx="-21" cy="19" r="4" fill="#E67E22"/>
    <circle cx="-97" cy="-32" r="4" fill="#E67E22"/>

    <!-- Fine-tuned (Green) -->
    <polygon points="0,-101 72,-23 55,75 -28,24 -91,-30" fill="rgba(15, 110, 86, 0.1)" stroke="url(#greenGrad)" stroke-width="2" stroke-dasharray="5,2"/>
    <circle cx="0" cy="-101" r="4" fill="#0F6E56"/>
    <circle cx="72" cy="-23" r="4" fill="#0F6E56"/>
    <circle cx="55" cy="75" r="4" fill="#0F6E56"/>
    <circle cx="-28" cy="24" r="4" fill="#0F6E56"/>
    <circle cx="-91" cy="-30" r="4" fill="#0F6E56"/>
  </g>

  <!-- ════════════════════════════════════════
       KEY INSIGHTS (Moved down further)
  ════════════════════════════════════════ -->
  <rect x="50" y="930" width="1100" height="90" rx="8" fill="#F0F4F8" stroke="#D0D0D0" stroke-width="1"/>
  <text x="70" y="955" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1A1A18">Key Insights:</text>
  
  <g font-family="-apple-system, sans-serif" font-size="12" fill="#333">
    <!-- Item 1 -->
    <circle cx="85" cy="970" r="4" fill="#185FA5"/>
    <text x="95" y="975">Extractive is faster and shorter but has lower ROUGE scores.</text>
    
    <!-- Item 2 -->
    <circle cx="450" cy="985" r="4" fill="#E67E22"/>
    <text x="460" y="990">Abstractive offers fluent summaries but is computationally expensive.</text>
    
    <!-- Item 3 -->
    <circle cx="850" cy="1000" r="4" fill="#0F6E56"/>
    <text x="860" y="1005">Fine-tuned BART yields the best performance trade-off.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(850, 1030)" font-family="-apple-system, sans-serif" font-size="12">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#185FA5"/>
    <text x="20" y="11">Extractive</text>
    <rect x="90" y="0" width="12" height="12" rx="2" fill="#E67E22"/>
    <text x="110" y="11">Abstractive</text>
    <rect x="200" y="0" width="12" height="12" rx="2" fill="#0F6E56"/>
    <text x="220" y="11">Fine-tuned</text>
  </g>

</svg>
