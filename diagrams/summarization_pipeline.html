<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{margin:0;padding:16px;font-family:sans-serif;background:transparent;}</style>
</head><body>
<svg width="100%" viewBox="0 0 680 580" role="img">
<title>Text summarization pipeline overview</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7a5e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b04420" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Input -->
<rect x="190" y="20" width="300" height="44" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="38" text-anchor="middle" dominant-baseline="central" fill="#111">CNN/DailyMail article</text>
<text font-size="11" x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#333">raw text — up to 800 words</text>

<line x1="340" y1="64" x2="340" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Preprocessing -->
<rect x="190" y="92" width="300" height="44" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="110" text-anchor="middle" dominant-baseline="central" fill="#111">Preprocessing</text>
<text font-size="11" x="340" y="128" text-anchor="middle" dominant-baseline="central" fill="#333">lowercase · punct · stopwords · tokenize</text>

<line x1="340" y1="136" x2="340" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Feature extraction -->
<rect x="190" y="164" width="300" height="44" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="182" text-anchor="middle" dominant-baseline="central" fill="#111">Feature extraction</text>
<text font-size="11" x="340" y="200" text-anchor="middle" dominant-baseline="central" fill="#333">TF-IDF matrix + sentence embeddings</text>

<!-- Fork -->
<line x1="250" y1="208" x2="250" y2="240" stroke="#1a7a5e" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<line x1="430" y1="208" x2="430" y2="240" stroke="#b04420" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
<path d="M190 208 L150 208 L150 244" fill="none" stroke="#1a7a5e" stroke-width="1.5"/>
<path d="M490 208 L530 208 L530 244" fill="none" stroke="#b04420" stroke-width="1.5"/>

<!-- Baseline box -->
<rect x="30" y="244" width="240" height="88" rx="8" fill="#A8DCC8" stroke="#1a7a5e" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="150" y="264" text-anchor="middle" dominant-baseline="central" fill="#111">Baseline — Extractive</text>
<text font-size="11" x="150" y="284" text-anchor="middle" dominant-baseline="central" fill="#0a2a20">Score sentences by TF-IDF</text>
<text font-size="11" x="150" y="300" text-anchor="middle" dominant-baseline="central" fill="#0a2a20">+ embedding cosine similarity</text>
<text font-size="11" x="150" y="316" text-anchor="middle" dominant-baseline="central" fill="#0a2a20">Pick top 3 sentences</text>

<!-- Advanced box -->
<rect x="410" y="244" width="240" height="88" rx="8" fill="#F5B49A" stroke="#b04420" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="530" y="264" text-anchor="middle" dominant-baseline="central" fill="#111">Advanced — Abstractive</text>
<text font-size="11" x="530" y="284" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">BART (facebook/bart-large-cnn)</text>
<text font-size="11" x="530" y="300" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">Pretrained on CNN/DailyMail</text>
<text font-size="11" x="530" y="316" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">Generate new fluent text</text>

<!-- Arrows down to outputs -->
<line x1="150" y1="332" x2="150" y2="380" stroke="#1a7a5e" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<line x1="530" y1="332" x2="530" y2="380" stroke="#b04420" stroke-width="1.5" marker-end="url(#arrow-coral)"/>

<!-- Output boxes -->
<rect x="40" y="384" width="220" height="44" rx="8" fill="#A8DCC8" stroke="#1a7a5e" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="150" y="402" text-anchor="middle" dominant-baseline="central" fill="#111">Extractive summary</text>
<text font-size="11" x="150" y="420" text-anchor="middle" dominant-baseline="central" fill="#0a2a20">3 original sentences from article</text>

<rect x="420" y="384" width="220" height="44" rx="8" fill="#F5B49A" stroke="#b04420" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="530" y="402" text-anchor="middle" dominant-baseline="central" fill="#111">Abstractive summary</text>
<text font-size="11" x="530" y="420" text-anchor="middle" dominant-baseline="central" fill="#2a0e02">New generated fluent paragraph</text>

<!-- Both feed into evaluation -->
<path d="M150 428 L150 480 L270 480" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M530 428 L530 480 L410 480" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Evaluation -->
<rect x="190" y="460" width="300" height="44" rx="8" fill="#C8C2F0" stroke="#4a40b0" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="478" text-anchor="middle" dominant-baseline="central" fill="#111">Evaluation</text>
<text font-size="11" x="340" y="496" text-anchor="middle" dominant-baseline="central" fill="#110d40">ROUGE-1 · ROUGE-2 · ROUGE-L · qualitative</text>

<line x1="340" y1="504" x2="340" y2="528" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Report -->
<rect x="190" y="532" width="300" height="36" rx="8" fill="#E8E8E8" stroke="#999" stroke-width="0.8"/>
<text font-size="13" font-weight="600" x="340" y="550" text-anchor="middle" dominant-baseline="central" fill="#111">Report + Streamlit demo</text>
</svg>
</body></html>
