<svg width="100%" viewBox="0 0 680 1000" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Abstractive Summarization Pipeline Deep Dive</title>
  <desc>Vertical flowchart showing the BART abstractive summarization pipeline with increased spacing.</desc>

  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
    <!-- Gradients for headers -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#185FA5"/>
      <stop offset="100%" style="stop-color:#378ADD"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6A11CB"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="1000" fill="#FAFAF8"/>

  <!-- ── Title ── -->
  <text x="340" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1A1A18">Abstractive Summarization Pipeline</text>
  <text x="340" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#5F5E5A">BART Large (Seq2Seq Transformer)</text>

  <!-- ════════════════════════════════════════
       STEP 1 — INPUT
  ════════════════════════════════════════ -->
  <text x="340" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" letter-spacing="0.5">STEP 1</text>

  <g>
    <rect x="218" y="110" width="244" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">Article Text</text>
    <text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">~200 words · raw input</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="170" x2="340" y2="200" stroke="#3D3D3A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════
       STEP 2 — PREPARATION
  ════════════════════════════════════════ -->
  <text x="340" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" letter-spacing="0.5">STEP 2</text>

  <g>
    <rect x="150" y="220" width="380" height="70" rx="8" fill="#FFF8E6" stroke="#B07800" stroke-width="0.5"/>
    <text x="340" y="244" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#7A5000">Add Prefix &amp; BPE Tokenize</text>
    <text x="340" y="264" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#B07800">Input: "summarize: Article text..."</text>
    <text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" fill="#B07800">Tokens: [72, 3987, 1012, 5, 890, ...]</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="340" y1="290" x2="340" y2="320" stroke="#3D3D3A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════
       STEP 3 — ENCODER
  ════════════════════════════════════════ -->
  <text x="340" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" letter-spacing="0.5">STEP 3</text>

  <g>
    <rect x="150" y="340" width="380" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#0C447C">BART Encoder (12 Layers)</text>
    <text x="340" y="384" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#185FA5">Bidirectional Self-Attention</text>
    <text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#378ADD">Output: 768-dim context vectors</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="340" y1="410" x2="340" y2="440" stroke="#3D3D3A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════
       STEP 4 — BEAM SEARCH DECODER (Large Box)
  ════════════════════════════════════════ -->
  <text x="340" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" letter-spacing="0.5">STEP 4</text>

  <g>
    <rect x="150" y="460" width="380" height="160" rx="8" fill="#EDE7FF" stroke="#6A11CB" stroke-width="0.5"/>
    <text x="340" y="482" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#3A0070">Beam Search Decoder</text>
    <text x="340" y="500" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6A11CB">Autoregressive Generation (4 beams)</text>

    <!-- Beam Visualization Chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">
      <!-- Beam 1 -->
      <rect x="170" y="515" width="340" height="22" rx="4" fill="#FFFFFF" stroke="#6A11CB" stroke-width="0.5"/>
      <text x="185" y="529" fill="#3A0070">Beam 1:</text>
      <text x="235" y="529" fill="#0C447C">"The" (0.92) → "recent" (0.87) → ...</text>
      
      <!-- Beam 2 -->
      <rect x="170" y="545" width="340" height="22" rx="4" fill="#FFFFFF" stroke="#B07800" stroke-width="0.5"/>
      <text x="185" y="559" fill="#3A0070">Beam 2:</text>
      <text x="235" y="559" fill="#B07800">"Recent" (0.05) → "AI" (0.03) → ...</text>
      
      <!-- Beam 3 & 4 (Simplified) -->
      <rect x="170" y="575" width="340" height="22" rx="4" fill="#F8F5FF" stroke="#A4B0BE" stroke-width="0.5"/>
      <text x="340" y="589" text-anchor="middle" fill="#555577">Beam 3 &amp; 4: Lower probability paths...</text>
    </g>
    
    <text x="340" y="610" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6A11CB">Length Penalty: 2.0 · No Repeat N-gram Size: 3</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="340" y1="620" x2="340" y2="650" stroke="#3D3D3A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════
       STEP 5 — DETOKENIZER
  ════════════════════════════════════════ -->
  <text x="340" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" letter-spacing="0.5">STEP 5</text>

  <g>
    <rect x="150" y="670" width="380" height="60" rx="8" fill="#FFF8E6" stroke="#B07800" stroke-width="0.5"/>
    <text x="340" y="694" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#7A5000">Detokenizer</text>
    <text x="340" y="714" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#B07800">Merge subword tokens → Fluent text</text>
  </g>

  <!-- Arrow 5→6 -->
  <line x1="340" y1="730" x2="340" y2="760" stroke="#3D3D3A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════
       STEP 6 — OUTPUT
  ════════════════════════════════════════ -->
  <text x="340" y="770" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" letter-spacing="0.5">STEP 6</text>

  <g>
    <rect x="150" y="780" width="380" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="804" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#085041">Abstractive Summary</text>
    <text x="340" y="824" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">Compression 8.6% · ~2.5s</text>
  </g>

  <!-- ── Legend ── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#3D3D3A" transform="translate(0, 880)">
    <rect x="14" y="0" width="11" height="11" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="30" y="10">Encoder path</text>
    <rect x="14" y="18" width="11" height="11" rx="2" fill="#D4B3FF" stroke="#6A11CB" stroke-width="0.5"/>
    <text x="30" y="28">Decoder / Beam Search</text>
    <rect x="14" y="36" width="11" height="11" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="30" y="46">Output</text>
  </g>
</svg>
