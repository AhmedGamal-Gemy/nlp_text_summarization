<text x="1557.0500000000002" y="496" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;no_repeat_ngram_size=3&quot;</text>
<text x="1989.25" y="626" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Stop at &#39;&lt;/s&gt;&#39; token&quot;</text>
